name: Feature request
description: Suggest something the exhibit should show
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What can you not see right now
      description: Describe the thing about a run that is currently invisible or hard to read.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you want on screen
    validations:
      required: true
