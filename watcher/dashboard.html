<meta charset="utf-8">
<title>Exhibit 1 — Orchestrator-Workers Pipeline, Live</title>
<style>
  :root {
    --paper:   #FBFAF7;
    --panel:   #FFFFFF;
    --ink:     #14181F;
    --muted:   #6B7280;
    /* Carries the 8-9px mono micro labels. #9AA0A8 measured 2.64:1 on paper,
       which fails WCAG AA and turns to mush under video compression. This is
       the lightest grey that still clears 4.5:1. */
    --faint:   #6E757D;
    --rule:    #DAD7D0;
    --navy:    #0B2545;
    --wine:    #8B2635;
    --fill:    #EDEBE5;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Liberation Mono", monospace;
    --sans: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  /* Card width is measured from the container, so the vertical scrollbar has to
     be accounted for before the measurement. Without a reserved gutter the
     board is laid out scrollbar-free, grows taller, the scrollbar appears, and
     the layout is suddenly ~15px too wide. */
  html { scrollbar-gutter: stable; }

  body {
    margin: 0;
    padding: 16px 22px 40px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  /* tab strip */
  .tabs {
    display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
    border-bottom: 1px solid var(--ink); margin-bottom: 14px;
  }
  .tab {
    font: inherit; font-size: 11px; letter-spacing: .06em;
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 6px 12px 7px; cursor: pointer; color: var(--muted);
  }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--navy); }
  /* Must be allowed to shrink: nowrap plus a badge made this wider than a
     narrow window and pushed the whole page into horizontal scroll. */
  .tabs .watching {
    margin-left: auto; font-family: var(--mono); font-size: 10.5px;
    color: var(--ink); padding: 0 12px;
    border-left: 1px solid var(--rule);
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tabs .watching .wk {
    color: var(--faint); font-size: 8.5px; letter-spacing: .09em;
    text-transform: uppercase; margin-right: 5px;
  }
  .tabs .watching .wq { color: var(--faint); }
  /* Which window this session belongs to, and how long its prompt cache has
     left. Two sessions open at once look identical without the first, and the
     first call after the cache lapses costs ten times the one before it. */
  .tabs .watching .wsrc, .tabs .watching .wcache {
    margin-left: 8px; padding: 1px 6px; font-family: var(--mono);
    font-size: 9px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); border: 1px solid var(--rule);
  }
  .tabs .watching .wcache.cold { color: var(--wine); border-color: #D8B4A8; }
  /* Another conversation is live and you are not looking at it. */
  .tabs .watching .wo {
    margin-left: 10px; padding: 1px 7px; font-size: 9px;
    letter-spacing: .05em; text-transform: uppercase;
    color: #8A6A24; border: 1px solid #C9AC6B; background: #FCFAF4;
  }
  .tabs .totals {
    font-family: var(--mono); font-size: 10.5px;
    color: var(--faint); padding-right: 4px;
  }

  /* The roster: every agent, its assignment and its last action, in one table
     above the diagram. Reads top to bottom without decoding the tree. */
  /* Three rows plus the header, then scroll. A viewport-relative cap gave a
     different number of visible agents on every screen; a row count does not,
     and it leaves a predictable amount of room for the tree underneath.
     The real cap is set inline by sizeRoster() from the measured rows — rows
     wrap, so their height is not a constant. This is the pre-paint fallback. */
  .crew-wrap {
    border: 1px solid var(--rule); background: var(--panel);
    margin-bottom: 14px; overflow: auto;
    max-height: 128px;
  }
  table.crew { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  table.crew th {
    position: sticky; top: 0; z-index: 2; background: var(--panel);
    text-align: left; font-family: var(--mono); font-weight: 400;
    font-size: 8.5px; letter-spacing: .09em; text-transform: uppercase;
    color: var(--faint); padding: 6px 10px 5px;
    border-bottom: 1px solid var(--ink); white-space: nowrap;
  }
  table.crew td {
    padding: 5px 10px; border-bottom: 1px solid var(--rule);
    vertical-align: baseline; color: var(--muted);
  }
  table.crew tr:last-child td { border-bottom: 0; }
  table.crew tbody tr { cursor: pointer; }
  table.crew tbody tr:hover td { background: #F6F4EF; }
  table.crew tr.on td { background: #F1EEE6; box-shadow: inset 2px 0 0 var(--navy); }
  table.crew tr.orphan .nm { color: var(--wine); }
  table.crew .nm {
    color: var(--ink); font-weight: 600; letter-spacing: .02em; white-space: nowrap;
  }
  table.crew .lvl {
    font-family: var(--mono); font-size: 8.5px; color: var(--faint);
    margin-left: 6px; font-weight: 400;
  }
  /* "opus 5 xhigh" wrapping onto three lines turned every row into three rows
     worth of height, which costs the panel layout more than the column is
     worth. It is short text; give it one line. */
  table.crew .mdl { white-space: nowrap; }
  /* Status reads as a word, not just a colour, so it survives a screenshot and
     a colour-blind reader. The dot in the name column carries the same signal. */
  .state {
    font-family: var(--mono); font-size: 9px; letter-spacing: .07em;
    text-transform: uppercase; padding: 2px 6px; white-space: nowrap;
    border: 1px solid var(--rule); color: var(--muted); background: var(--paper);
  }
  .state.active   { border-color: var(--navy); color: var(--navy); font-weight: 600; }
  .state.waiting  { border-color: #C9AC6B; color: #8A6A24; }
  .state.stalled  { border-color: #C9AC6B; color: #8A6A24; }
  .state.orphaned { border-color: var(--wine); color: var(--wine); font-weight: 600; }
  .state.idle, .state.done { color: var(--faint); }

  table.crew .mono { font-family: var(--mono); }
  table.crew .sm { font-size: 10px; }
  table.crew .num { text-align: right; white-space: nowrap; }
  table.crew .when { white-space: nowrap; color: var(--muted); }
  table.crew .act b { color: var(--navy); font-weight: 400; }
  /* the two columns that can run long share whatever width is left */
  table.crew .doing, table.crew .act {
    max-width: 0; width: 34%; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }

  /* Agents that are not currently deployed. Same cards as the tree, at the
     same width, simply not wired into the hierarchy — a finished agent has no
     live relationship to draw a branch to. */
  .parked { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--rule); }
  .parked .bh {
    font-family: var(--mono); font-size: 9px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint); margin: 0 0 10px 2px;
  }
  .parked .slots {
    display: grid; grid-template-columns: repeat(auto-fill, var(--card, 300px));
    gap: var(--gap, 16px); justify-content: center;
  }

  /* Zoom control, fixed to the viewport so scrolling never takes it away. */
  .zoomer {
    position: fixed; right: 14px; bottom: 16px; z-index: 40;
    display: flex; align-items: stretch;
    background: var(--panel); border: 1px solid var(--rule);
    box-shadow: 0 2px 10px rgba(0, 0, 0, .10);
  }
  .zoomer button {
    font: inherit; background: none; border: 0; cursor: pointer;
    color: var(--muted); padding: 5px 9px;
  }
  .zoomer button:hover { color: var(--ink); background: #F6F4EF; }
  .zoomer .zbtn { font-size: 15px; line-height: 1; width: 30px; }
  .zoomer .zlbl {
    font-family: var(--mono); font-size: 10px; letter-spacing: .04em;
    border-left: 1px solid var(--rule); border-right: 1px solid var(--rule);
    min-width: 74px; color: var(--ink);
  }
  .zoomer button:disabled { opacity: .35; cursor: default; background: none; }

  /* Dialogue: the agent-to-agent thread, read as a chat. Alternating sides
     make it obvious at a glance when the conversation changes hands. */
  .thread { display: flex; flex-direction: column; gap: 12px; padding: 4px 0 24px; }
  .turn {
    align-self: flex-start; max-width: min(60ch, 78%);
    background: var(--panel); border: 1px solid var(--navy);
    border-radius: 14px 14px 14px 3px; padding: 9px 13px 10px;
  }
  .turn.alt {
    align-self: flex-end; border-radius: 14px 14px 3px 14px;
    background: #FCFBF8;
  }
  .turn.spawn { border-color: #C9AC6B; background: #FCFAF4; }
  /* an answer coming back up the tree */
  .turn.reply { border-color: var(--rule); background: var(--paper); }
  .turn.reply .meta b { color: var(--ink); }
  .turn .meta {
    font-family: var(--mono); font-size: 9px; letter-spacing: .07em;
    text-transform: uppercase; color: var(--faint); margin-bottom: 5px;
    display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
  }
  .turn .meta b { color: var(--navy); font-weight: 400; }
  .turn.spawn .meta b { color: #8A6A24; }
  .turn .meta .arw { color: var(--faint); }
  .turn .meta .t2 { margin-left: auto; }
  .turn p {
    margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--ink);
    font-style: italic;
  }
  .thread .empty {
    align-self: center; max-width: 46ch; text-align: center;
    color: var(--muted); font-size: 12px; padding: 26px 0;
  }

  /* one row per depth level, so children sit under whoever spawned them */
  .tier { margin-bottom: 0; }
  .tier-label {
    font-family: var(--mono); font-size: 9px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--faint); margin: 0 0 6px 2px;
  }


  /* speech bubbles: what a live agent is saying, popping out of its node.
     They are absolutely positioned so they reserve no space of their own. The
     top padding clears the first row; the row gap clears every row after it,
     which is what stops a wrapped fan-out from stamping its bubbles through
     the cards above. */
  .agents.speaking { padding-top: 74px; row-gap: 82px; }
  .exhibit { overflow: visible; }
  .tier + .tier, .link + .tier { margin-top: 0; }
  .node { position: relative; }
  .bubble {
    position: absolute; bottom: calc(100% + 10px); left: -6px; right: -6px;
    background: var(--panel); border: 1px solid var(--navy);
    box-shadow: 3px 3px 0 rgba(11, 37, 69, .07);
    padding: 8px 10px; font-size: 11px; line-height: 1.42;
    font-style: italic; color: var(--ink); z-index: 6;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical;
    overflow: hidden;
    animation: pop .35s cubic-bezier(.2, .9, .3, 1.2) both;
  }
  /* little stem pointing down into the node */
  .bubble::after,
  .bubble::before {
    content: ""; position: absolute; top: 100%; left: 22px;
    border: 6px solid transparent; border-top-color: var(--navy);
  }
  .bubble::after { border-width: 5px; left: 23px; border-top-color: var(--panel); }
  @keyframes pop {
    from { opacity: 0; transform: translateY(7px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }
  .bubble .lbl {
    display: block; font-family: var(--mono); font-style: normal;
    font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 3px;
  }

  /* click a node: it grows in place and shows its history */
  .node { cursor: pointer; }
  .node:hover { box-shadow: 0 0 0 1px var(--navy); }
  .node:focus-visible, table.crew tbody tr:focus-visible {
    outline: 2px solid var(--navy); outline-offset: 2px;
  }
  /* The opened agent, floating over the board. Fixed rather than in-grid, so
     opening one card never moves the others. */
  .overlay {
    position: fixed; inset: 0; z-index: 60;
    background: rgba(20, 24, 31, .28);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .overlay[hidden] { display: none; }
  .overlay .node.expanded {
    cursor: default; width: min(860px, 94vw); max-height: 88vh;
    overflow-y: auto; background: var(--panel);
    border: 1px solid var(--ink); box-shadow: 0 18px 48px rgba(0,0,0,.22);
    padding: 16px 20px 18px;
    animation: rise .16s ease-out both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px) scale(.99); }
    to   { opacity: 1; transform: none; }
  }
  /* inside the overlay the card has room, so nothing needs clamping */
  .overlay .node .job,
  .overlay .node .says { -webkit-line-clamp: unset; display: block; }
  .overlay .node .history { max-height: none; }
  .overlay .node .last .ld { white-space: normal; }
  .back {
    font: inherit; font-size: 10.5px; letter-spacing: .06em;
    background: none; border: 1px solid var(--rule); color: var(--muted);
    padding: 3px 9px; cursor: pointer; margin-bottom: 10px;
  }
  .back:hover { color: var(--ink); border-color: var(--navy); }
  .history {
    margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--rule);
    max-height: 46vh; overflow-y: auto;
  }
  .history h4 {
    font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; margin: 14px 0 7px;
  }
  .history h4:first-child { margin-top: 0; }
  .history .line {
    border-left: 2px solid var(--rule); padding: 1px 0 1px 10px;
    margin-bottom: 8px; font-size: 11.5px; color: var(--muted); line-height: 1.45;
  }
  .history .line b {
    display: block; font-family: var(--mono); font-size: 9px;
    color: var(--faint); font-weight: 400; margin-bottom: 2px;
  }

  /* filter bar */
  /* Wrapping alone is not enough: a flex item whose content is wider than the
     line still refuses to shrink past its min-content size and pushes out. */
  .bar > * { min-width: 0; }
  .bar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
    padding: 0 0 16px; margin-bottom: 16px;
    border-bottom: 1px solid var(--rule);
    font-size: 11px; color: var(--muted);
  }
  /* Session titles are long, and a select sizes itself to its widest option,
     so without a cap the filter bar alone pushed the page into horizontal
     scroll on a narrow window. */
  .bar label { display: inline-flex; align-items: center; gap: 6px;
               min-width: 0; max-width: 100%; }
  .bar select { max-width: 100%; }
  #f-session { max-width: min(420px, 100%); }
  #f-projects { max-width: min(260px, 100%); }
  /* An element rule with `display` beats the UA stylesheet's [hidden] rule, so
     without this the hidden picker stays on screen. */
  .bar label[hidden] { display: none; }
  .bar select {
    font: inherit; font-size: 11px; color: var(--ink); background: var(--panel);
    border: 1px solid var(--rule); padding: 3px 5px; border-radius: 0;
  }
  .bar .chk { cursor: pointer; }
  .bar input[type=checkbox] { accent-color: var(--navy); margin: 0; }
  .bar .hint { color: var(--faint); font-size: 10px; }
  .bar .count { margin-left: auto; font-family: var(--mono); color: var(--faint); }

  /* group heading when not grouping by session */
  .group-h {
    font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; margin: 18px 0 8px;
  }
  .node.orphan { border-color: var(--wine); }
  .node.orphan .role { color: var(--wine); }


  /* ---- diagram ------------------------------------------------------- */
  .exhibit {
    background: var(--panel);
    border: 1px solid var(--rule);
    padding: 30px 34px 22px;
  }
  /* auto-fit so however many workers exist, they pack into rows that fit */
  /* Cards keep a sane width and centre themselves, so a tier holding one agent
     doesn't stretch it across the whole panel. */
  /* Cards spread laterally across the full width of their tier, as they did
     before the tree layout. Only a tier holding a single agent is reined in,
     so it doesn't stretch edge to edge on its own. */
  /* Every card is the same size at every level — the tier just holds more or
     fewer of them. The grid, the branch lines above it and the balloons below
     all share one width, so a branch drops onto a card instead of past it. */
  /* --card and --gap are solved in JS from the space actually available and
     set on #tiers, so every card on the board is the same size and that size
     follows the window instead of overflowing it. */
  #tiers { --card: 300px; --gap: 16px; transform-origin: top left; }
  /* A scaled child still reserves its unscaled height, so the wrapper trims the
     empty space the transform leaves under the board. */
  .exhibit { position: relative; }
  .tier {
    --w: calc(var(--cols, 3) * var(--card) + (var(--cols, 3) - 1) * var(--gap));
    width: 100%;
  }
  .agents {
    display: grid;
    grid-template-columns: repeat(var(--cols, 3), var(--card));
    gap: var(--gap);
    width: var(--w); margin: 0 auto;
    justify-content: center;
  }
  .tier > .link, .tier > .wires, .tier > .tier-label {
    width: var(--w); margin-left: auto; margin-right: auto;
  }

  /* Only min-width survives here: a grid child needs it to be allowed to
     shrink. The rest restated base values, and the .13em tracking silently
     overrode the tighter setting that stops long names truncating — so a card
     in the tree and the same card in the overlay disagreed. */
  .agents .node { min-width: 0; }
  .link { display: block; width: 100%; height: 22px; }
  /* preserveAspectRatio="none" stretches x far more than y, which would render
     vertical strokes as thick blocks. non-scaling-stroke keeps them 1px. */
  .link path {
    fill: none; stroke: var(--rule); stroke-width: 1.25;
    vector-effect: non-scaling-stroke;
  }
  .link path.on { stroke: var(--navy); stroke-width: 1.75; }
  .link path.flow {
    stroke: var(--navy); stroke-width: 1.75;
    stroke-dasharray: 5 7;
    animation: march 1.1s linear infinite;
  }
  @keyframes march { to { stroke-dashoffset: -24; } }

  /* ---- node ---------------------------------------------------------- */
  .node {
    border: 1px solid var(--rule);
    background: var(--panel);
    padding: 12px 14px 13px;
    min-width: 210px;
  }
  .node.on   { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
  .node.done { border-color: #B9BDB4; }
  .node.terminal { background: var(--navy); border-color: var(--navy); color: #fff; }
  .node.terminal .k, .node.terminal .role { color: rgba(255,255,255,.66); }
  .node.terminal .headline { color: #fff; }

  .node-top {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; margin-bottom: 9px;
  }
  /* Tracking was .13em, which cost about 30px on a long name and truncated
     "ORCHESTRATOR" to "ORCHESTRA...". The name matters more than the spacing. */
  .role {
    font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
    font-weight: 600; color: var(--muted);
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1 1 auto;
  }
  /* Must be allowed to shrink. A full model id is wider than a narrow card, and
     an unshrinkable badge pushes the whole board into horizontal scroll. */
  .badge {
    font-family: var(--mono); font-size: 10px; color: var(--faint);
    white-space: nowrap; flex: 0 1 auto; min-width: 0;
    overflow: hidden; text-overflow: ellipsis;
  }
  .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 6px; vertical-align: 1px;
    border: 1px solid var(--faint); background: transparent;
  }
  .dot.on   { background: var(--navy); border-color: var(--navy); animation: pulse 1.5s ease-in-out infinite; }
  .dot.done { background: #B9BDB4; border-color: #B9BDB4; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .28; } }

  /* context meter */
  .meter { height: 5px; background: var(--fill); margin: 2px 0 9px; }
  .meter > i { display: block; height: 100%; background: var(--navy); transition: width .4s ease; }
  /* A window about to fill is worth seeing before it does. This session hit
     its limit twice and compacted away 2M tokens with nothing on screen to
     say so, which is exactly the moment the numbers stop making sense. */
  .meter.hot > i  { background: #B8860B; }
  .meter.full > i { background: var(--wine); }
  .warn {
    font-family: var(--mono); font-size: 9px; letter-spacing: .06em;
    text-transform: uppercase; margin: 7px 0 0; padding: 3px 6px;
    border-left: 2px solid var(--wine); color: var(--wine); background: #FBF6F4;
  }
  .warn.near { border-left-color: #B8860B; color: #8A6508; background: #FBF8F0; }
  /* The compaction detail only appears on the opened card. On a collapsed one
     it crowded out "last said", which is the line that tells you what the
     agent is actually doing, and that matters more at a glance. */
  .warn.compacted { text-transform: none; letter-spacing: .02em; line-height: 1.5; }
  .warn.compacted b { letter-spacing: .06em; text-transform: uppercase; }
  .warn.compacted .cline { display: block; color: var(--muted); font-size: 9px; }

  /* stat grid inside a node */
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 14px; }
  .k { font-size: 10.5px; color: var(--muted); }
  .v { font-family: var(--mono); font-size: 12.5px; text-align: right; }

  /* What the agent was sent to do — the card says who, this says why. */
  /* sits directly above the context meter, so it needs clearance or the meter
     track reads as an underline on the last line of text */
  .job {
    margin: 5px 0 9px; font-size: 11.5px; line-height: 1.35; color: var(--muted);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .last {
    margin-top: 9px; padding-top: 8px; border-top: 1px dotted var(--rule);
    display: grid; grid-template-columns: auto 1fr auto; gap: 0 7px;
    align-items: baseline;
  }
  .last .lk {
    grid-column: 1 / -1; font-family: var(--mono); font-size: 8.5px;
    letter-spacing: .09em; text-transform: uppercase; color: var(--faint);
    margin-bottom: 2px;
  }
  .last .lt { font-family: var(--mono); font-size: 10.5px; color: var(--navy); }
  .last .ld {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
  }
  .last .lz { font-family: var(--mono); font-size: 9.5px; color: var(--faint); }

  /* age and spawn count, the two things you check without opening the card */
  .foot {
    display: flex; justify-content: space-between; gap: 10px; margin-top: 7px;
    font-family: var(--mono); font-size: 9px; letter-spacing: .05em;
    text-transform: uppercase; color: var(--faint);
  }

  /* ---- source note --------------------------------------------------- */
  .source {
    margin-top: 14px; padding-top: 9px; border-top: 1px solid var(--rule);
    font-size: 11px; font-style: italic; color: #595959;
    display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap;
  }

  /* ---- trace table --------------------------------------------------- */
  h2 {
    font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted); font-weight: 600; margin: 30px 0 9px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  thead th {
    text-align: left; font-weight: 600; font-size: 10px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--ink); padding: 0 10px 6px 0;
  }
  tbody td { padding: 5px 10px 5px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  tbody tr:hover { background: #F4F2EC; }
  td.t { font-family: var(--mono); color: var(--muted); white-space: nowrap; width: 1%; }
  td.who { white-space: nowrap; width: 1%; font-weight: 600; }
  td.who .ref {
    font-family: var(--mono); font-weight: 400; font-size: 10px;
    color: var(--faint); margin-left: 8px;
  }
  td.st { white-space: nowrap; width: 1%; color: var(--muted); font-size: 11px; }
  .roster td.detail { max-width: 40ch; }
  td.tool { font-family: var(--mono); white-space: nowrap; width: 1%; }
  td.detail { color: var(--muted); font-family: var(--mono); font-size: 11px;
              overflow-wrap: anywhere; }
  .empty { color: var(--faint); font-style: italic; padding: 14px 0; }

  /* live commentary: what each agent said between tool calls */
  .msg {
    border-left: 2px solid var(--rule);
    padding: 2px 0 2px 12px; margin-bottom: 11px;
  }
  .msg.live { border-left-color: var(--navy); }
  .msg .who2 {
    font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase;
    font-weight: 600; color: var(--ink);
  }
  .msg .t2 { font-family: var(--mono); font-size: 10px; color: var(--faint); margin-left: 8px; }
  .msg p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); max-width: 100ch; }
  /* One agent addressing another. This is a conversation between two cards, so
     the balloon floats between them rather than living inside either one. */
  /* Balloons sit on the same grid as the cards, each one in its own speaker's
     column. That is what makes the tail land on the right card without any
     arithmetic: the balloon is already directly underneath it. */
  .wires {
    display: grid;
    grid-template-columns: repeat(var(--cols, 3), var(--card));
    gap: 8px var(--gap);
    /* bottom margin keeps the balloon clear of the next level's branch line */
    margin: 14px 0 12px;
  }
  .wire {
    position: relative; padding: 8px 13px; max-width: 100%;
    background: var(--panel); border: 1px solid var(--navy); border-radius: 14px;
    font-size: 11px; line-height: 1.45; color: var(--ink); font-style: italic;
    box-shadow: 0 1px 0 rgba(11, 37, 69, .07);
    cursor: pointer;
  }
  /* The clamp lives on the quote, not the balloon. Clamping the whole balloon
     counted the sender label as one of the three lines, so the last line of
     text was sliced through the middle instead of ending cleanly. */
  .wire .said {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .wire.open .said { display: block; }
  .wire .more {
    display: block; margin-top: 5px; font-style: normal;
    font-family: var(--mono); font-size: 8.5px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--faint);
  }
  .wire:hover .more { color: var(--navy); }
  /* A balloon is a moment, not a permanent fixture: it fades once it has been
     on screen long enough to read. The Dialogue tab keeps every one of them. */
  .wire { animation: wire-in .2s ease-out both; }
  @keyframes wire-in {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: none; }
  }
  /* Tail points up at the card that actually spoke. --tail is set per balloon
     from the speaker's position; a fixed offset pointed at empty space as soon
     as the balloon was not directly under its own card. */
  .wire::before, .wire::after {
    content: ""; position: absolute; left: var(--tail, 22px);
    border: 8px solid transparent;
  }
  .wire::before { top: -16px; border-bottom-color: var(--navy); margin-left: -8px; }
  .wire::after  {
    top: -14px; border-bottom-color: var(--panel);
    border-width: 7px; margin-left: -7px;
  }

  /* No tail means the speaker is not the card directly above, so the balloon
     leans on its label instead of a pointer that would name the wrong agent. */
  .wire.no-tail::before, .wire.no-tail::after { display: none; }
  .wire.no-tail { border-style: dashed; }

  .wire b {
    display: block; font-family: var(--mono); font-size: 9px; font-weight: 400;
    letter-spacing: .08em; text-transform: uppercase;
    color: var(--navy); margin-bottom: 3px; font-style: normal;
  }
  .wire .arw { color: var(--faint); margin: 0 3px; }

  /* spawning reads as a different act from talking, so tint it */
  .wire.spawn { border-color: #C9AC6B; background: #FCFAF4; }
  .wire.spawn::before { border-bottom-color: #C9AC6B; }
  .wire.spawn::after  { border-bottom-color: #FCFAF4; }
  .wire.spawn b { color: #8A6A24; }

  /* Run totals, as a strip above the tree so they survive a short panel. */
  .ledger {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 26px;
    padding: 10px 18px; border-bottom: 1px solid var(--rule);
    background: var(--panel);
  }
  .ledger .cell { display: flex; flex-direction: column; gap: 1px; padding: 2px 0; }
  .ledger .cell.lead { margin-right: 8px; padding-right: 22px; border-right: 1px solid var(--rule); }
  .ledger .k {
    font-family: var(--mono); font-size: 9px; letter-spacing: .07em;
    text-transform: uppercase; color: var(--faint);
  }
  .ledger .v { font-family: var(--mono); font-size: 13px; color: var(--ink); }
  .ledger .v.big { font-size: 21px; color: var(--navy); letter-spacing: -.01em; }

  /* Every other block on the card is labelled; this one was a bare italic line
     with no clue what it was. */
  .says .sk {
    display: block; font-family: var(--mono); font-size: 8.5px;
    letter-spacing: .09em; text-transform: uppercase; color: var(--faint);
    font-style: normal; margin-bottom: 3px;
  }
  .says {
    margin-top: 9px; padding-top: 8px; border-top: 1px dotted var(--rule);
    font-size: 11.5px; color: var(--muted); font-style: italic;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .q { color: var(--faint); }

  @media (max-width: 860px) {
    body { padding: 22px 16px 40px; }
    /* No grid override here. The column count and card width are solved in JS
       against the real container width, so forcing 1fr at a breakpoint made
       cards fill their tier and stop matching each other. */
    .link { height: 26px; }
  }

  /* ---- panel mode ------------------------------------------------------
     Docked at the bottom of an editor the viewport is wide and very short, so
     a vertical cascade puts most of the tree out of reach. Below this height
     the same tree flows left to right instead: one column per level, each
     level's cards stacked, and the whole board scrolls sideways. */
  @media (max-height: 620px) {
    body { padding: 0 0 6px; }
    .exhibit { padding: 10px 14px 12px; }
    .bar { padding: 5px 14px; gap: 8px 12px; }
    .ledger { padding: 7px 14px; gap: 0 20px; }
    .ledger .v.big { font-size: 17px; }
    /* A 340px panel cannot carry five rows of chrome and a tree. The strip
       repeats the Log tab, so it goes; the roster stays because it is the one
       readable summary, but capped so it never crowds out the diagram. */
    .source { display: none !important; }
    /* Rows are tighter here; sizeRoster() measures them and still shows three. */
    .crew-wrap { max-height: 83px; margin-bottom: 8px; }
    table.crew th { padding: 4px 8px 3px; }
    table.crew td { padding: 3px 8px; }

    #tiers {
      display: flex; align-items: flex-start; gap: 0;
      overflow-x: auto; padding-bottom: 4px;
    }
    /* One column per level here, so the tier's shared width has to collapse to
       a single card. Left at the multi-column value it stretches the label,
       connector and balloon row far past the cards they belong to. */
    #tiers .tier { flex: 0 0 auto; width: auto; --w: var(--card); }
    /* levels after the first are pushed off by an arrow gutter */
    #tiers .tier + .tier { padding-left: 34px; }
    #tiers .tier + .tier::before {
      content: "\2192"; position: absolute; left: 9px; top: 30px;
      color: var(--faint); font-size: 15px;
    }
    #tiers .tier { position: relative; }
    /* one column of cards per level, and the vertical connector is meaningless
       sideways, so the arrow gutter replaces it */
    #tiers .agents { grid-template-columns: var(--card); gap: 10px; }
    /* Cards stack into one column here, so the balloons have to follow or they
       end up laid out against a grid that no longer exists. */
    #tiers .wires { grid-template-columns: var(--card); gap: 8px; }
    #tiers .wires .wire { grid-column: 1 !important; }
    #tiers .link { display: none; }
    .agents.speaking { padding-top: 0; }
    .bubble { display: none; }          /* .says inside the card carries it */
    .wires { margin: 10px 0 0; }
    .wire { max-width: 300px; }

    /* Two cards have to stack in a column barely taller than one, so the card
       trades its long stat list for a 4-across ledger line. */
    .node { padding: 8px 11px 9px; }
    .node .stats { grid-template-columns: repeat(4, 1fr); gap: 0 8px; }
    .node .stats .k {
      grid-row: 1; font-family: var(--mono); font-size: 8.5px;
      letter-spacing: .05em; text-transform: uppercase; color: var(--faint);
      white-space: nowrap; overflow: hidden;
    }
    .node .stats .v { grid-row: 2; text-align: left; font-size: 11.5px; }
    .node .says { margin-top: 6px; padding-top: 6px; -webkit-line-clamp: 2; }
    .node .last { margin-top: 6px; padding-top: 6px; }
    .node .meter { margin: 6px 0; }
    .node .job { -webkit-line-clamp: 1; margin-top: 3px; }
    .node .foot { margin-top: 5px; }  }
</style>

<div class="bar">

    <select id="f-group">
      <option value="session">by session</option>
      <option value="project">by project</option>
      <option value="flat">flat</option>
    </select>
  </label>
  <!-- Which session, or which projects, depending on the Group mode. Filled
       from /index.json, which walks ~/.claude/projects. -->
  <label id="pick-session">Session
    <select id="f-session"><option value="">this session (auto)</option></select>
  </label>
  <!-- Auto-follow jumps to whichever session wrote last, so with two running at
       once the board changes under you. This nails it to what is showing. -->
  <label class="chk" id="pick-lock"><input type="checkbox" id="f-lock"> lock session</label>
  <label id="pick-project" hidden>Projects
    <select id="f-projects" multiple size="3"></select>
  </label>

    <span class="hint">&ge;5 tools</span></label>
  <label class="chk"><input type="checkbox" id="f-orphan"> orphaned only</label>
  <!-- Off by default: the board shows what you are working on, not everything

</div>

<nav class="tabs" id="tabs">

  <button class="tab" data-view="dialogue">Dialogue</button>

  <span class="watching" id="watching"></span>

<section data-view="tree">
  <div class="ledger" id="output"></div>
  <!-- The board above the board: who exists, what each was sent to do, and the
       last thing it actually did. Readable without decoding the diagram. -->
  <div class="crew-wrap">
    <table class="crew" id="crew">
      <thead><tr>
        <th>Agent</th><th>Status</th><th>Deployed</th><th>Model</th><th>Assignment</th>
        <th>Last action</th><th class="num">Context</th><th class="num">Tools</th>
      </tr></thead>
      <tbody id="crew-body"></tbody>

  </div>
  <!-- Zoom, pinned to the viewport so it stays put however far you scroll.
       The label reports the scale actually in use, including what "fit"
       resolved to. #f-zoom stays the single source of truth. -->
  <div class="zoomer" id="zoomer">
    <button class="zbtn" data-z="out" title="Zoom out" aria-label="Zoom out">&minus;</button>
    <button class="zlbl" data-z="fit" id="zoomlbl" title="Back to fit">fit</button>
    <button class="zbtn" data-z="in" title="Zoom in" aria-label="Zoom in">+</button>
  </div>
  <!-- Options are generated from ZOOM_STEPS at startup. Maintained by hand they
       drifted apart, and setting a value with no matching option silently
       blanks a select rather than erroring. -->

  <!-- An opened agent floats above the board instead of pushing it around, so
       the tree you were reading stays exactly where you left it. -->
